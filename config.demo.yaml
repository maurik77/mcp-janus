# config.demo.yaml
# MCP Janus demo configuration: Keycloak IdP + ngrok public tunnel.
#
# Usage:
#   source .env.keycloak-dev
#   CONFIG_FILE=config.demo ./bin/mcpproxy

proxy:
  base_url: https://suboral-wiley-predesirously.ngrok-free.dev
  listen_addr: ":8080"
  log_level: info
  log_format: text
  cimd_enabled: false
  cimd_localhost_port_insensitive: true

idp:
  client_id: mcp-janus
  # Override via env: export MCP_IDP_CLIENT_SECRET=<value from setup-keycloak.sh>
  client_secret: CHANGE_ME
  openid_configuration_url: http://localhost:8888/realms/mcp-dev/.well-known/openid-configuration
  jwt_leeway: 30s
  skip_tls_verify: false
  fetch_retry_attempts: 5
  fetch_retry_delay: 3s
  scopes:
    - openid
    - profile
    - email
    - offline_access
  claims_mapping:
    sub: X-User-Sub
    name: X-User-Full-Name
    email: X-User-Email
    preferred_username: X-User-Username

encryption:
  master_key: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef

telemetry:
  enabled: false
  service_name: mcp-proxy-demo
  service_version: 0.0.0-demo
  otlp_endpoint: localhost:4317

upstream:
  name: weather-demo
  resource: http://localhost:8081
  base_url: http://localhost:8081
  path_prefix: /mcp
